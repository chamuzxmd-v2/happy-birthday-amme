<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday My Mom 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      text-align: center;
      color: #fff;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3.2rem;
      margin-top: 40px;
      animation: pulse 1s infinite alternate;
    }

    h2 {
      font-weight: normal;
      margin: 10px 20px;
    }

    .img-box {
      margin: 30px auto;
    }

    .img-box img {
      width: 90%;
      max-width: 450px;
      border-radius: 25px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .footer {
      margin: 40px 0 20px;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- 🎵 Background Music -->
  <audio autoplay loop>
    <source src="https://image2url.com/r2/default/audio/1770414031617-c692e508-b21c-46ac-8270-7d12556ea1b1.mp3" type="audio/mpeg">
  </audio>

  <h1>🎂 Happy Birthday My Mom 🎉</h1>
  <h2>May your day be filled with love 💖</h2>
  <h2>Smiles 😊 and happiness forever ✨</h2>

  <!-- 🖼️ Big Image -->
  <div class="img-box">
    <img src="https://base44.app/api/apps/6984abed7c09c47cafdda427/files/public/6984abed7c09c47cafdda427/276429147_11688.jpg" alt="Birthday Image">
  </div>

  <div class="footer">
    © 2026 | Powered by Chamu </>
  </div>

</body>
</html>
